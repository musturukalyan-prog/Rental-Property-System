function propertyPhoto(property){let photo=Number(property.photoIndex)||((Number((property.id||'').match(/\d+/)?.[0]||0)%40)+1),extension=roomImageExtensions[photo-1]||'jpg';return `<img src="images/room-${String(photo).padStart(2,'0')}.${extension}" alt="Rental room ${photo}: ${property.bedrooms} bedroom home in ${property.location}, ₹${property.price} per month" loading="lazy">`}
async function init(){try{let base=await(await fetch('properties.json')).json(),custom=JSON.parse(localStorage.getItem('rentnest-custom')||'[]'),removed=new Set(JSON.parse(localStorage.getItem('rentnest-removed')||'[]'));properties=[...custom,...base.filter(property=>!removed.has(property.id))].map((property,index)=>({...property,photoIndex:index%40+1}))}catch(e){properties=[]}render()}
function svgHouse(id){let colors=[['#d9c2a3','#a66c44','#f0dfc7'],['#b6c9d8','#557993','#e7edf0'],['#eed9ba','#ac7855','#f7ead7'],['#c4d5c2','#65856c','#e7eee3'],['#d6c8df','#7c6793','#eee7f4']][Number((id||'PROP0001').slice(-2))%5];return `<svg viewBox="0 0 620 330" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sky${id}" x2="0" y2="1"><stop stop-color="#d5e5f2"/><stop offset="1" stop-color="#f6efe4"/></linearGradient><linearGradient id="wall${id}" x2="0" y2="1"><stop stop-color="${colors[0]}"/><stop offset="1" stop-color="${colors[2]}"/></linearGradient></defs><rect width="620" height="330" fill="url(#sky${id})"/><circle cx="500" cy="65" r="32" fill="#fff1c5" opacity=".75"/><path d="M0 250Q90 214 170 250T340 240T620 237V330H0" fill="#9db9a1"/><path d="M90 167 287 58l206 110v144H90Z" fill="url(#wall${id})"/><path d="m62 173 226-132 225 132-18 24L287 68 79 197Z" fill="${colors[1]}"/><path d="M251 111h75v77h-75z" fill="#7196a8" stroke="#fff3dd" stroke-width="8"/><path d="M265 111v77m-14-38h75" stroke="#dbe9eb" stroke-width="4"/><path d="M375 205h77v107h-77z" fill="#75523f"/><path d="M390 217h48v45h-48z" fill="#aac7d0"/><path d="M123 212h82v65h-82z" fill="#87aab5" stroke="#fff3dd" stroke-width="8"/><path d="M164 212v65m-41-32h82" stroke="#d9e7e5" stroke-width="4"/><path d="M228 294h244" stroke="#fff" stroke-width="5" opacity=".5"/><path d="M0 297q87-24 171 8t193 1 256-7v31H0" fill="#769776"/><path d="M36 292v-69m-13 27 13-25 15 25m-35-8 21-24 22 24" stroke="#557f61" stroke-width="9" fill="none"/><path d="M537 290v-70m-14 25 14-24 16 25m-35-8 19-23 22 24" stroke="#557f61" stroke-width="8" fill="none"/><rect y="316" width="620" height="14" fill="#78977b"/></svg>`}
function brand(){return `<span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z" fill="currentColor"/><path d="m8 7 4-4 9 8" stroke="white" stroke-width="1.2"/></svg></span>`}
function header(){return `<header class="topbar"><div class="brand">${brand()}RentNest</div><nav class="navlinks"><a class="${page==='home'?'active':''}" onclick="go('home')">Home</a><a class="${page==='browse'?'active':''}" onclick="go('browse')">Properties</a><a class="${page==='about'?'active':''}" onclick="go('about')">About</a><a onclick="go('bookings')">My bookings</a></nav><div class="nav-actions"><button class="booking-button" title="My bookings" aria-label="My bookings" onclick="go('bookings')">▣</button><button class="theme-toggle" title="Switch theme" aria-label="Switch theme" onclick="toggleTheme()">${theme==='dark'?'☼':'☾'}</button>${user?`<button class="btn btn-light" onclick="go('${user.role==='Owner'?'owner':'dashboard'}')">${user.role==='Owner'?'Owner requests':'My dashboard'}</button>`:`<button class="btn-plain" onclick="go('ownerLogin')">Owner sign in</button><button class="btn-plain" onclick="go('login')">Login</button><button class="btn" onclick="go('register')">Sign up</button>`}</div></header>`}
function showAbout(){if(page!=='home'){page='home';render()}requestAnimationFrame(()=>document.querySelector('#features')?.scrollIntoView({behavior:'smooth'}))}
function toggleTheme(){theme=theme==='dark'?'light':'dark';localStorage.setItem('rentnest-theme',theme);document.body.classList.toggle('dark',theme==='dark');render()}
function artCard(p,tag=''){return `<div class="property-art">${propertyPhoto(p)}${tag?`<span class="tag">${tag}</span>`:''}<button class="heart ${saved.has(p.id)?'saved':''}" aria-label="${saved.has(p.id)?'Remove saved property':'Save property'}" onclick="toggleSave('${p.id}',event)">${saved.has(p.id)?'♥':'♡'}</button></div>`}
function card(p){return cleanMarkup(`<article class="property-card" onclick="openDetails('${p.id}')">${artCard(p,p.furnished)}<div class="card-body"><div class="price-row"><span class="price">${money(p.price)} <small>/ month</small></span><span class="loc">? ${p.location}</span></div><div class="type">${p.bedrooms} BHK ${p.type}</div><div class="loc">? ${p.location}</div><div class="amenities"><span>? <b>${p.bedrooms}</b> beds</span><span>? <b>${p.bathrooms}</b> baths</span><span>? <b>${p.area}</b> sq.ft</span></div><span class="furn-tag">${p.furnished}</span></div></article>`)}
function home(){let featured=[...properties].sort((a,b)=>b.area-a.area).slice(0,3);return `${header()}<main><section class="hero"><div class="hero-bg"></div><div class="hero-inner"><span class="eyebrow">Your next chapter starts here</span><h1>Find your perfect <em>rental home.</em></h1><p>Thoughtful recommendations. Transparent pricing. A place that feels like yours.</p><div class="searchbox"><div class="field"><label>LOCATION</label><select id="hero-location">${locations.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>MONTHLY BUDGET</label><select id="hero-budget"><option value="">Any budget</option><option value="0-10000">Under ?10,000</option><option value="10000-15000">?10,000 � ?15,000</option><option value="15000-25000">?15,000 � ?25,000</option><option value="25000-999999">?25,000+</option></select></div><div class="field"><label>BEDROOMS</label><select id="hero-beds"><option value="">Any</option><option value="1">1 BHK</option><option value="2">2 BHK</option><option value="3">3 BHK</option><option value="4">4+ BHK</option></select></div><button class="btn" onclick="heroSearch()">? &nbsp; Search homes</button></div><div class="hero-note">? <b>600+ verified listings</b> &nbsp;�&nbsp; Updated from your rental dataset</div><div class="hero-stats"><div class="hero-stat"><strong>600+</strong><span>Homes to explore</span></div><div class="hero-stat"><strong>7</strong><span>Local markets</span></div><div class="hero-stat"><strong>Smart</strong><span>Recommendations</span></div></div></div></section><section class="section" id="features"><div class="section-head"><div><span class="section-kicker">A simpler way home</span><h2>Renting, made personal.</h2><p>Everything you need to find the right place with confidence.</p></div><button class="btn btn-light" onclick="go('browse')">Explore homes ?</button></div><div class="features"><div class="feature"><div class="feature-icon">?</div><div><strong>Verified listings</strong><small>Clear details, less guesswork</small></div></div><div class="feature"><div class="feature-icon">?</div><div><strong>Smart recommendations</strong><small>Matched to your preferences</small></div></div><div class="feature"><div class="feature-icon">?</div><div><strong>Price insights</strong><small>Know the local rent range</small></div></div><div class="feature"><div class="feature-icon">?</div><div><strong>Demand trends</strong><small>Explore the rental market</small></div></div></div></section><section class="section" style="padding-top:0"><div class="section-head"><div><span class="section-kicker">Handpicked for you</span><h2>Homes worth a closer look.</h2><p>Browse well-sized homes from the latest listings.</p></div><button class="btn-plain" onclick="go('browse')">View all homes ?</button></div><div class="grid">${featured.map(card).join('')}</div></section><section class="section" style="padding-top:0"><div class="lower-cta"><div><h3>Your next home might be one search away.</h3><p>Tell us what matters, and find the places that fit.</p></div><button class="btn" onclick="go('browse')">Find my home ?</button></div></section></main><footer class="footer"><div><div class="brand" style="color:#fff">${brand()}RentNest</div><p>Better homes. Brighter futures.</p></div><p>� 2026 RentNest � Rental insights made simple</p></footer>`}
function shell(content,active='dashboard'){let links=[['dashboard','⌂','Dashboard'],['browse','⌕','Browse properties'],['bookings','▣','My bookings'],['preferences','⚙','My preferences'],['recommended','★','Recommended'],['price','₹','Price prediction'],['analytics','▥','Analytics'],['listings','▤','My listings'],['profile','○','Profile']];return `${header()}<div class="app-shell"><aside class="sidebar"><div class="side-brand">${brand()} &nbsp; RentNest</div><div class="side-label">Workspace</div>${links.map(([id,icon,label])=>`<a class="side-link ${active===id?'active':''}" onclick="go('${id}')"><span>${icon}</span>${label}</a>`).join('')}<div class="side-label">Account</div><a class="side-link" onclick="logout()"><span>↪</span>Log out</a><div class="side-bottom">Making room for better living.<br>RentNest · 2026</div></aside><main class="main">${content}</main></div>`}
function head(title,sub,actions=''){return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div><div class="user-pill"><span class="avatar">${(user?.name||'G').slice(0,1).toUpperCase()}</span><span><b>${user?.name||'Guest renter'}</b><br><small style="color:#8190a4">${user?.role||'Renter'}</small></span>${actions}</div></div>`}
function dashboard(){let recommended=getRecommended().slice(0,3);return shell(`${head(`Welcome back, ${(user?.name||'there').split(' ')[0]}!`,'Here are a few quick stats and homes selected for you.') }<div class="stats-grid dashboard-stats"><div class="stat-card"><div class="stat-icon" style="background:#e7f8ef;color:#20a871">?</div><div><small>Recommended for you</small><strong>${getRecommended().length}</strong></div></div><div class="stat-card"><div class="stat-icon" style="background:#fff0f1;color:#e85870">?</div><div><small>Saved properties</small><strong>${saved.size}</strong></div></div><div class="stat-card"><div class="stat-icon" style="background:#f3edff;color:#8761da">?</div><div><small>Markets covered</small><strong>7</strong></div></div></div><div class="panel"><div class="panel-title"><h3>Start exploring</h3><span>Your next home is waiting</span></div><div class="lower-cta"><div><h3>Discover homes that match your needs.</h3><p>Set your preferences to get thoughtful recommendations.</p></div><button class="btn" onclick="go('preferences')">Set preferences ?</button></div></div><div class="panel"><div class="panel-title"><h3>Recommended for you</h3><button class="btn-plain" onclick="go('recommended')">View all ?</button></div><div class="cards-grid">${recommended.map(card).join('')}</div></div>`,'dashboard')}
function filtered(){return properties.filter(p=>(!filters.location||filters.location==='All locations'||p.location===filters.location)&&(!filters.budget||(p.price>=Number(filters.budget.split('-')[0])&&p.price<=Number(filters.budget.split('-')[1])))&&(!filters.bedrooms||p.bedrooms===Number(filters.bedrooms)||filters.bedrooms==='4'&&p.bedrooms>=4)&&(!filters.type||p.type===filters.type))}
function browse(){return shell(`${head('Find your place',`Explore ${properties.length} rental homes across seven local markets.`,'')}<div class="browse-toolbar"><input id="search-text" placeholder="?  Search by location or property ID..." oninput="applyBrowse()"><select id="filter-location" onchange="applyBrowse()">${locations.map((x,i)=>`<option value="${i?x:''}">${x}</option>`).join('')}</select><select id="filter-budget" onchange="applyBrowse()"><option value="">Any price</option><option value="0-10000">Under ?10,000</option><option value="10000-15000">?10,000 � ?15,000</option><option value="15000-25000">?15,000 � ?25,000</option><option value="25000-999999">?25,000+</option></select><select id="filter-beds" onchange="applyBrowse()"><option value="">Any bedrooms</option><option value="1">1 bedroom</option><option value="2">2 bedrooms</option><option value="3">3 bedrooms</option><option value="4">4+ bedrooms</option></select><select id="filter-type" onchange="applyBrowse()"><option value="">Any type</option>${[...new Set(properties.map(p=>p.type))].sort().map(t=>`<option>${t}</option>`).join('')}</select></div><div class="panel-title"><h3>Available homes</h3><span id="result-count">${filtered().length} homes</span></div><div class="cards-grid" id="browse-results">${filtered().slice(0,60).map(card).join('')}</div><div style="text-align:center;padding:22px"><button id="more-button" class="btn btn-light ${filtered().length>60?'':'hidden'}" onclick="showMore()">Load more homes</button></div>`,'browse')}
function applyBrowse(){filters={location:document.querySelector('#filter-location').value,budget:document.querySelector('#filter-budget').value,bedrooms:document.querySelector('#filter-beds').value,type:document.querySelector('#filter-type').value};let q=document.querySelector('#search-text').value.toLowerCase(),items=filtered().filter(p=>`${p.location} ${p.id} ${p.type}`.toLowerCase().includes(q));document.querySelector('#result-count').textContent=`${items.length} homes`;document.querySelector('#browse-results').innerHTML=items.slice(0,60).map(card).join('')||'<div class="empty">No homes match these filters. Try a wider search.</div>';document.querySelector('#more-button').classList.toggle('hidden',items.length<=60)}function showMore(){let q=document.querySelector('#search-text').value.toLowerCase(),items=filtered().filter(p=>`${p.location} ${p.id} ${p.type}`.toLowerCase().includes(q));document.querySelector('#browse-results').innerHTML=items.map(card).join('');document.querySelector('#more-button').classList.add('hidden')}
function heroSearch(){filters={location:document.querySelector('#hero-location').value,budget:document.querySelector('#hero-budget').value,bedrooms:document.querySelector('#hero-beds').value,type:''};go('browse')}
function getRecommended(){let pref=JSON.parse(localStorage.getItem('rentnest-pref')||'{}');return [...properties].map(p=>{let score=72+(pref.location&&p.location===pref.location?14:0)+(pref.bedrooms&&p.bedrooms===Number(pref.bedrooms)?8:0)+(pref.furnished&&p.furnished===pref.furnished?4:0)+(pref.budget&&p.price<=Number(pref.budget)?5:0);return{...p,score:Math.min(99,score)}}).sort((a,b)=>b.score-a.score||a.price-b.price)}
function recommended(){let items=getRecommended().slice(0,18);return shell(`${head('Picked for you','These homes are matched to your search preferences.') }<div class="panel-title"><h3>Personalized matches</h3><span>${items.length} top matches</span></div>${items.map(p=>`<div class="result-row"><div class="property-art">${svgHouse(p.id)}</div><div><h3>${p.bedrooms} BHK ${p.type}</h3><div class="loc">? ${p.location} � ${p.area} sq.ft</div><div class="price">${money(p.price)} <small style="font:500 11px 'DM Sans';color:#8390a1">/ month</small></div><div class="amenities"><span>? ${p.bedrooms} beds</span><span>? ${p.bathrooms} baths</span><span>${p.furnished}</span></div></div><div class="result-actions"><span class="match">${p.score}% match</span><br><button class="btn" style="margin-top:12px" onclick="openDetails('${p.id}')">View details</button></div></div>`).join('')}`,'recommended')}
function preference(){let pref=JSON.parse(localStorage.getItem('rentnest-pref')||'{}');return shell(`${head('My preferences','Tell RentNest what makes a home right for you.') }<div class="form-card" style="margin:10px 0;max-width:650px;box-shadow:none"><h1>Your ideal home</h1><p>We use these details to rank listings and price insights for you.</p><label>Preferred location</label><select id="pref-location">${locations.map((x,i)=>`<option value="${i?x:''}" ${pref.location===x?'selected':''}>${x}</option>`).join('')}</select><label>Monthly budget</label><input id="pref-budget" type="number" placeholder="e.g. 15000" value="${pref.budget||''}"><label>Bedrooms</label><select id="pref-bedrooms"><option value="">Any number</option>${[1,2,3,4].map(n=>`<option value="${n}" ${Number(pref.bedrooms)===n?'selected':''}>${n}${n===4?'+':''} bedrooms</option>`).join('')}</select><label>Furnishing</label><select id="pref-furnished"><option value="">No preference</option><option ${pref.furnished==='Furnished'?'selected':''}>Furnished</option><option ${pref.furnished==='Semi-Furnished'?'selected':''}>Semi-Furnished</option><option ${pref.furnished==='Unfurnished'?'selected':''}>Unfurnished</option></select><button class="btn" onclick="savePreferences()">Save my preferences</button></div>`,'preferences')}
function savePreferences(){localStorage.setItem('rentnest-pref',JSON.stringify({location:document.querySelector('#pref-location').value,budget:document.querySelector('#pref-budget').value,bedrooms:document.querySelector('#pref-bedrooms').value,furnished:document.querySelector('#pref-furnished').value}));toast('Preferences saved. Your recommendations are updated!');go('recommended')}
function predictPrice(){let loc=document.querySelector('#price-location')?.value||'Vizag',beds=Number(document.querySelector('#price-beds')?.value||2),same=properties.filter(p=>p.location===loc&&p.bedrooms===beds);if(!same.length)same=properties.filter(p=>p.location===loc);let prices=same.map(p=>p.price).sort((a,b)=>a-b),med=prices[Math.floor(prices.length/2)]||12000;document.querySelector('#price-result').innerHTML=`<div class="estimate"><small>ESTIMATED RENT FOR ${loc.toUpperCase()} � ${same.length} COMPARABLE LISTINGS</small><strong>${money(Math.round(med*.85))} � ${money(Math.round(med*1.15))} / month</strong><span style="font-size:11px;color:#547a67">Median comparable rent: ${money(med)} � Based on ${same.length} homes in your dataset</span></div>`}
function pricePage(){return shell(`${head('Area price prediction','Explore a realistic rent range based on comparable listings.') }<div class="details-layout"><section class="panel"><h3 style="margin:0 0 8px;font:700 16px Manrope">Estimate a monthly rent</h3><p style="font-size:12px;color:#738198">Choose an area and home size to see the typical local price range.</p><div class="modal-grid"><div><label class="form-card" style="display:block;margin:10px 0 0;padding:0;border:0;box-shadow:none">Location<select id="price-location" onchange="predictPrice()" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:8px">${locations.slice(1).map(x=>`<option>${x}</option>`).join('')}</select></label></div><div><label style="display:block;margin:10px 0 0;font-size:12px">Bedrooms<select id="price-beds" onchange="predictPrice()" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;margin-top:6px">${[1,2,3,4].map(x=>`<option value="${x}">${x} bedrooms</option>`).join('')}</select></label></div></div><div id="price-result"></div></section><section class="panel"><h3 style="font:700 16px Manrope;margin:0 0 10px">How we estimate</h3><p style="font-size:12px;line-height:1.8;color:#718096">We compare listings in the selected market and bedroom category, then use the middle listed rent as the typical price. The range includes a 15% margin above and below to show natural variation.</p><div class="stat-card" style="margin-top:18px"><div class="stat-icon">?</div><div><small>Local listings used</small><strong>${properties.length}</strong></div></div></section></div><div class="panel" style="margin-top:18px"><div class="panel-title"><h3>Average rent by area</h3><span>Monthly rent � dataset</span></div>${barChart(areaStats(),'blue')}</div>`,'price')}
function areaStats(){return locations.slice(1).map(l=>{let ps=properties.filter(p=>p.location===l);return {label:l,value:Math.round(ps.reduce((s,p)=>s+p.price,0)/ps.length),count:ps.length}})}
function barChart(items,color='blue'){let max=Math.max(...items.map(x=>x.value));return `<div class="bars">${items.map(x=>`<div class="bar-col"><span class="bar-value">${money(x.value).replace('? ','?')}</span><div class="bar ${color==='green'?'green':''}" style="height:${Math.max(5,x.value/max*78)}%" title="${x.count||''} listings"></div><span class="bar-label">${x.label}</span></div>`).join('')}</div>`}
function analytics(){let areas=areaStats(),types=[...new Set(properties.map(p=>p.type))].map(label=>({label,value:properties.filter(p=>p.type===label).length})),furn=[...new Set(properties.map(p=>p.furnished))].map(label=>({label,value:properties.filter(p=>p.furnished===label).length}));let colors=['#367ce8','#27b47d','#ffad49','#8f6bd6','#f16f86'];let total=types.reduce((s,x)=>s+x.value,0),cum=0,gradient=types.map((x,i)=>{let start=cum/total*100;cum+=x.value;return `${colors[i%colors.length]} ${start}% ${cum/total*100}%`}).join(',');return shell(`${head('Rental market analytics','A clear view of rents, listing mix, and local supply.') }<div class="stats-grid dashboard-stats"><div class="stat-card"><div class="stat-icon" style="background:#e7f8ef;color:#20a871">?</div><div><small>Average monthly rent</small><strong>${money(Math.round(properties.reduce((s,p)=>s+p.price,0)/properties.length)).replace('? ','?')}</strong></div></div><div class="stat-card"><div class="stat-icon" style="background:#f3edff;color:#8761da">?</div><div><small>Markets covered</small><strong>${areas.length}</strong></div></div><div class="stat-card"><div class="stat-icon" style="background:#fff4e5;color:#e99a2d">?</div><div><small>Median home size</small><strong>${[...properties.map(p=>p.area)].sort((a,b)=>a-b)[Math.floor(properties.length/2)]} <small>sq.ft</small></strong></div></div></div><div class="chart-grid"><div class="chart-panel"><h3>Average rent by city</h3>${barChart(areas)}</div><div class="chart-panel"><h3>Listings by location</h3>${barChart(areas.map(x=>({...x,value:x.count})),'green')}</div><div class="chart-panel"><h3>Property type distribution</h3><div class="donut-wrap"><div class="donut" style="background:conic-gradient(${gradient})"></div><div class="legend">${types.map((x,i)=>`<div><i style="background:${colors[i%colors.length]}"></i>${x.label} <b>${Math.round(x.value/total*100)}%</b></div>`).join('')}</div></div></div><div class="chart-panel"><h3>Listings by furnishing</h3>${barChart(furn,'green')}</div></div>`,'analytics')}
function listings(){let mine=properties.slice(0,20);return shell(`${head('Listing management','Review the property inventory and manage listings.',`<button class="btn" onclick="showAddModal()">+ Add property</button>`)}<div class="panel"><div class="panel-title"><h3>All listings</h3><span>Showing ${mine.length} of ${properties.length}</span></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Property</th><th>Location</th><th>Monthly rent</th><th>Status</th><th>Actions</th></tr></thead><tbody>${mine.map(p=>`<tr><td>${p.id}</td><td><strong>${p.bedrooms} BHK ${p.type}</strong></td><td>${p.location}</td><td>${money(p.price)}</td><td><span class="status">Active</span></td><td><button class="small-btn" onclick="openDetails('${p.id}')">View</button> <button class="small-btn danger" onclick="removeListing('${p.id}')">Remove</button></td></tr>`).join('')}</tbody></table></div><p style="font-size:11px;color:#8491a4;margin-top:12px">Listing changes are stored in this browser session.</p></div>`,'listings')}
function profile(){return shell(`${head('Your profile','Manage your account details and preferences.') }<div class="form-card" style="margin:10px 0;max-width:650px;box-shadow:none"><h1>Account details</h1><label>Full name</label><input id="profile-name" value="${user?.name||''}"><label>Email address</label><input id="profile-email" value="${user?.email||''}"><label>Account type</label><select id="profile-role"><option>Renter</option><option ${user?.role==='Admin'?'selected':''}>Admin</option></select><button class="btn" onclick="saveProfile()">Save changes</button></div>`,'profile')}
function loginPage(register=false){return `${header()}<main style="background:#f4f8fe;min-height:calc(100vh - 76px);padding:18px"><div class="form-card"><h1>${register?'Create an account':'Welcome back'}</h1><p>${register?'Find and list rental properties easily.':'Sign in to discover homes picked for you.'}</p>${register?'<label>Full name</label><input id="auth-name" placeholder="Your name">':''}<label>Email address</label><input id="auth-email" type="email" placeholder="you@example.com"><label>Password</label><input id="auth-password" type="password" placeholder="At least 6 characters">${register?'<label>Account type</label><select id="auth-role"><option>Renter</option><option>Owner</option><option>Admin</option></select>':''}<button class="btn" onclick="authenticate(${register})">${register?'Create account':'Log in'}</button><div class="form-switch">${register?'Already have an account?':'New to RentNest?'} <a onclick="go('${register?'login':'register'}')" style="color:var(--blue);font-weight:700;cursor:pointer">${register?'Log in':'Create an account'}</a></div></div></main>`}
function openDetails(id){selected=properties.find(p=>p.id===id);if(selected){page='details';render()}}function details(){let p=selected,peers=properties.filter(x=>x.location===p.location&&x.bedrooms===p.bedrooms),prices=peers.map(x=>x.price).sort((a,b)=>a-b),med=prices[Math.floor(prices.length/2)]||p.price;return shell(`${head('Property details',`${p.id} � ${p.location}`)}<div class="details-layout"><section><div class="gallery-main">${svgHouse(p.id)}</div><div class="panel" style="margin-top:15px"><h3 style="font:700 16px Manrope;margin:0 0 10px">About this home</h3><p style="font-size:13px;color:#748197;line-height:1.7">A lovely ${p.bedrooms} bedroom ${p.type.toLowerCase()} in ${p.location}. With ${p.area} sq.ft of space, ${p.furnished.toLowerCase()} interiors and ${p.parking?'parking available':'no dedicated parking'}, it could be the right fit for your next chapter.</p><div class="amenities"><span>? <b>${p.bedrooms}</b> bedrooms</span><span>? <b>${p.bathrooms}</b> bathrooms</span><span>? <b>${p.area}</b> sq.ft</span><span>${p.parking?'? Parking':'� No parking'}</span></div></div></section><section class="details-summary"><h2>${p.bedrooms} BHK ${p.type}</h2><div class="loc">? ${p.location}</div><div class="price" style="margin-top:18px">${money(p.price)} <small style="font:500 12px 'DM Sans';color:#8290a3">/ month</small></div><ul class="detail-list"><li><span>Bedrooms</span><b>${p.bedrooms}</b></li><li><span>Bathrooms</span><b>${p.bathrooms}</b></li><li><span>Area</span><b>${p.area} sq.ft</b></li><li><span>Furnishing</span><b>${p.furnished}</b></li><li><span>Parking</span><b>${p.parking?'Available':'Not available'}</b></li></ul><button class="btn" style="width:100%" onclick="toast('Enquiry sent! The property owner will be in touch.')">Contact owner</button><button class="btn btn-light" style="width:100%;margin-top:9px" onclick="toggleSave('${p.id}')">${saved.has(p.id)?'? Saved to your list':'? Save property'}</button><div class="estimate"><small>LOCAL PRICE RANGE � ${peers.length} COMPARABLE HOMES</small><strong>${money(Math.round(med*.85))} � ${money(Math.round(med*1.15))}</strong><span style="font-size:11px;color:#547a67">Typical rent for ${p.bedrooms} BHK homes in ${p.location}</span></div></section></div><div class="panel" style="margin-top:18px"><div class="panel-title"><h3>Similar homes nearby</h3><button class="btn-plain" onclick="go('browse')">Browse all ?</button></div><div class="cards-grid">${properties.filter(x=>x.location===p.location&&x.id!==p.id).slice(0,3).map(card).join('')}</div></div>`,'browse')}
function render(){let routes={dashboard,browse,recommended,preferences:preference,price:pricePage,analytics,listings,profile,details,bookings:bookingPage,about:aboutPage,owner:ownerPortal,ownerLogin:ownerLoginPage};app.innerHTML=cleanMarkup(page==='home'?home():page==='login'||page==='register'?loginPage(page==='register'):(routes[page]||dashboard)());if(page==='details'&&selected){let gallery=app.querySelector('.gallery-main'),actions=app.querySelector('.details-summary');if(gallery)gallery.innerHTML=propertyPhoto(selected);if(actions)actions.querySelector('.btn')?.insertAdjacentHTML('beforebegin','<button class="btn" style="width:100%;margin-bottom:9px" onclick="startBooking()">Book this home</button>')}}
function startBooking(){if(!selected)return;let minDate=new Date().toISOString().slice(0,10);document.querySelector('#modal-root').innerHTML=cleanMarkup(`<div class="modal-backdrop" onclick="if(event.target===this)this.remove()"><section class="modal booking-form"><div class="modal-head"><h2>Request this home</h2><button class="close" aria-label="Close" onclick="document.querySelector('#modal-root').innerHTML=''">×</button></div><p>${selected.bedrooms} BHK ${selected.type} · ${selected.location} · ${money(selected.price)} / month</p><label for="booking-name">Full name</label><input id="booking-name" value="${user?.name||''}" required><label for="booking-email">Email address</label><input id="booking-email" type="email" value="${user?.email||''}" required><label for="booking-phone">Phone number</label><input id="booking-phone" type="tel" required><label for="booking-date">Preferred move-in date</label><input id="booking-date" type="date" min="${minDate}" required><button class="btn" style="width:100%;margin-top:20px" onclick="submitBooking()">Send booking request</button></section></div>`)}
function submitBooking(){let name=document.querySelector('#booking-name').value.trim(),email=document.querySelector('#booking-email').value.trim(),phone=document.querySelector('#booking-phone').value.trim(),moveIn=document.querySelector('#booking-date').value;if(!name||!email.includes('@')||!phone||!moveIn){toast('Complete each field with valid contact details.');return}bookings.unshift({id:`BOOK${Date.now()}`,propertyId:selected.id,property:`${selected.bedrooms} BHK ${selected.type}`,location:selected.location,price:selected.price,name,email,phone,moveIn,status:'Requested',requestedAt:new Date().toISOString()});localStorage.setItem('rentnest-bookings',JSON.stringify(bookings));document.querySelector('#modal-root').innerHTML='';go('bookings');toast('Booking request saved.')}
function bookingPage(){let content=bookings.length?`<div class="panel">${bookings.map(item=>`<article class="booking-record"><div><h3>${item.property}</h3><p>${item.location} · ${money(item.price)} / month · Move-in ${item.moveIn}</p><p>Request ${item.id} · ${new Date(item.requestedAt).toLocaleDateString()}</p>${item.status==='Confirmed'?'<div class="booking-alert"><strong>Room booked successfully.</strong> The owner confirmed your request. Use the phone number provided if you need to contact them.</div>':item.status==='Declined'?'<div class="booking-alert">This request was declined by the owner. Please choose another available room.</div>':'<p>Your request is waiting for the owner to respond.</p>'}</div><span class="booking-status">${item.status}</span></article>`).join('')}</div>`:'<div class="panel empty">No booking requests yet. Open a room and submit a booking request to get started.</div>';return shell(`${head('My bookings','See owner responses to your room requests.') }<div class="owner-demo-note">Booking updates are shared only in this browser demo. A real customer-to-owner service needs a shared database.</div>${content}`,'bookings')}
function ownerLoginPage(){return `${header()}<main style="background:#f4f8fe;min-height:calc(100vh - 76px);padding:18px"><div class="form-card"><h1>Owner sign in</h1><p>Review room requests and update booking status.</p><label>Email address</label><input id="owner-email" type="email" placeholder="owner@example.com"><label>Password</label><input id="owner-password" type="password" placeholder="At least 6 characters"><button class="btn" onclick="ownerAuthenticate()">Open owner requests</button><p class="owner-demo-note" style="margin-top:16px">Demo mode: sign-in is not server-authenticated and bookings are stored only in this browser. Accepted requests open an SMS draft for the owner to send.</p><div class="form-switch">Need an owner account? <a onclick="go('register')" style="color:var(--blue);font-weight:700;cursor:pointer">Create one</a></div></div></main>`}
function ownerAuthenticate(){let email=document.querySelector('#owner-email').value.trim(),password=document.querySelector('#owner-password').value;if(!email.includes('@')||password.length<6){toast('Enter a valid email and a password with at least 6 characters.');return}user={name:email.split('@')[0],email,role:'Owner'};localStorage.setItem('rentnest-user',JSON.stringify(user));go('owner')}
function ownerPortal(){if(!user||user.role!=='Owner')return ownerLoginPage();let confirmed=new Set(bookings.filter(item=>item.status==='Confirmed').map(item=>item.propertyId)),available=properties.filter(property=>!confirmed.has(property.id)),pending=bookings.filter(item=>item.status==='Requested'),requestContent=bookings.length?bookings.map(item=>{let occupied=confirmed.has(item.propertyId)&&item.status!=='Confirmed';return `<article class="owner-request"><div><h3>${item.property}</h3><p>${item.location} · ${money(item.price)} / month · Move-in ${item.moveIn}</p><p>Customer: ${item.name} · ${item.email} · ${item.phone}</p><p>Request ${item.id} · ${item.status}</p></div><div class="owner-request-actions">${item.status==='Requested'?occupied?'<span class="booking-status">Room already booked</span>':`<button class="btn" onclick="acceptBooking('${item.id}')">Accept request</button>`:''}${item.status==='Requested'?`<button class="btn btn-light" onclick="declineBooking('${item.id}')">Decline</button>`:''}${item.status==='Confirmed'?`<button class="btn btn-light" onclick="textCustomer('${item.id}')">Text customer</button>`:''}<span class="booking-status">${item.status}</span></div></article>`}).join(''):'<div class="empty">No customer booking requests yet.</div>',roomContent=available.slice(0,40).map(property=>`<article class="owner-room-row"><div class="owner-room-thumb">${propertyPhoto(property)}</div><div><strong>${property.bedrooms} BHK ${property.type}</strong><p>${property.location} · ${money(property.price)} / month</p></div><span class="owner-free">Available</span></article>`).join('');return shell(`${head('Owner requests','Review customer requests and manage available rooms.') }<div class="owner-demo-note">Demo mode: booking records are shared only in this browser, not across customer and owner devices. Accepting a request saves the confirmation; Text customer opens an SMS draft and does not send it automatically.</div><div class="stats-grid dashboard-stats"><div class="stat-card"><div><small>Pending requests</small><strong>${pending.length}</strong></div></div><div class="stat-card"><div><small>Free rooms</small><strong>${available.length}</strong></div></div><div class="stat-card"><div><small>Confirmed rooms</small><strong>${confirmed.size}</strong></div></div></div><section class="panel"><div class="panel-title"><h3>Customer booking requests</h3><span>${bookings.length} total</span></div>${requestContent}</section><section class="panel"><div class="panel-title"><h3>Available rooms</h3><span>Showing ${Math.min(available.length,40)} of ${available.length} free rooms</span></div><div class="owner-room-list">${roomContent||'<div class="empty">No rooms are currently available.</div>'}</div></section>`,'owner')}
function acceptBooking(id){let booking=bookings.find(item=>item.id===id);if(!booking||booking.status!=='Requested')return;let occupied=bookings.some(item=>item.propertyId===booking.propertyId&&item.status==='Confirmed');if(occupied){toast('This room already has a confirmed booking.');render();return}booking.status='Confirmed';booking.confirmedAt=new Date().toISOString();booking.confirmedBy=user?.name||'Owner';localStorage.setItem('rentnest-bookings',JSON.stringify(bookings));render();toast('Room booked. The customer confirmation is ready.')}
function declineBooking(id){let booking=bookings.find(item=>item.id===id);if(!booking||booking.status!=='Requested')return;booking.status='Declined';booking.declinedAt=new Date().toISOString();localStorage.setItem('rentnest-bookings',JSON.stringify(bookings));render();toast('Booking request declined.')}
function textCustomer(id){let booking=bookings.find(item=>item.id===id);if(!booking||booking.status!=='Confirmed')return;let phone=(booking.phone||'').replace(/[^+\d]/g,''),message=`Hello ${booking.name}, your ${booking.property} in ${booking.location} is booked successfully for ${booking.moveIn}.`;if(!phone){toast('This booking has no customer phone number.');return}window.location.href=`sms:${phone}?body=${encodeURIComponent(message)}`}
function go(next){if(next==='owner'&&(!user||user.role!=='Owner'))next='ownerLogin';if(['dashboard','recommended','preferences','price','analytics','listings','profile'].includes(next)&&!user)next='login';page=next;render();window.scrollTo({top:0,behavior:'smooth'})}
function authenticate(reg){let email=document.querySelector('#auth-email').value.trim(),password=document.querySelector('#auth-password').value;if(!email||!password||reg&&!document.querySelector('#auth-name').value.trim()){toast('Please complete all required fields.');return}if(password.length<6){toast('Use a password with at least 6 characters.');return}user={name:reg?document.querySelector('#auth-name').value.trim():email.split('@')[0],email,role:reg?document.querySelector('#auth-role').value:'Renter'};localStorage.setItem('rentnest-user',JSON.stringify(user));toast(reg?'Welcome to RentNest!':'You are logged in.');go(user.role==='Owner'?'owner':'dashboard')}
function logout(){user=null;localStorage.removeItem('rentnest-user');go('home');toast('You have logged out.')}
function toggleSave(id,e){if(e)e.stopPropagation();saved.has(id)?saved.delete(id):saved.add(id);localStorage.setItem('rentnest-saved',JSON.stringify([...saved]));render()}
function saveProfile(){user={...user,name:document.querySelector('#profile-name').value,email:document.querySelector('#profile-email').value,role:document.querySelector('#profile-role').value};localStorage.setItem('rentnest-user',JSON.stringify(user));toast('Profile updated.');render()}
function toast(s){let root=document.querySelector('#toast-root');root.innerHTML=`<div class="toast">${s}</div>`;setTimeout(()=>root.innerHTML='',2600)}
function showAddModal(){document.querySelector('#modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)this.remove()"><div class="modal"><div class="modal-head"><h2>Add a property</h2><button class="close" onclick="document.querySelector('#modal-root').innerHTML=''">�</button></div><div class="modal-grid"><div><label>Location</label><select id="add-location">${locations.slice(1).map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Monthly rent (?)</label><input id="add-price" type="number" value="12000"></div><div><label>Bedrooms</label><input id="add-beds" type="number" value="2"></div><div><label>Bathrooms</label><input id="add-baths" type="number" value="2"></div><div><label>Area (sq.ft)</label><input id="add-area" type="number" value="1000"></div><div><label>Property type</label><select id="add-type"><option>Apartment</option><option>Independent House</option><option>Villa</option><option>Studio</option></select></div><div><label>Furnishing</label><select id="add-furnished"><option>Unfurnished</option><option>Furnished</option><option>Semi-Furnished</option></select></div><div><label>Parking</label><select id="add-parking"><option value="true">Available</option><option value="false">Not available</option></select></div></div><button class="btn" style="width:100%;margin-top:20px" onclick="addListing()">Add listing</button></div></div>`}
function addListing(){let p={id:`CUSTOM${Date.now().toString().slice(-6)}`,location:document.querySelector('#add-location').value,price:Number(document.querySelector('#add-price').value),bedrooms:Number(document.querySelector('#add-beds').value),bathrooms:Number(document.querySelector('#add-baths').value),area:Number(document.querySelector('#add-area').value),type:document.querySelector('#add-type').value,furnished:document.querySelector('#add-furnished').value,parking:document.querySelector('#add-parking').value==='true'};properties.unshift(p);let custom=JSON.parse(localStorage.getItem('rentnest-custom')||'[]');custom.unshift(p);localStorage.setItem('rentnest-custom',JSON.stringify(custom));document.querySelector('#modal-root').innerHTML='';toast('Your property was added.');render()}
function removeListing(id){properties=properties.filter(p=>p.id!==id);localStorage.setItem('rentnest-removed',JSON.stringify([...JSON.parse(localStorage.getItem('rentnest-removed')||'[]'),id]));toast('Listing removed.');render()}
const showAddModalOriginal=showAddModal;showAddModal=function(){showAddModalOriginal();let root=document.querySelector('#modal-root');root.innerHTML=cleanMarkup(root.innerHTML)}
home=function landingPage(){return `${header()}<main><section class="hero"><div class="hero-bg"></div><div class="hero-inner"><span class="eyebrow">Your next chapter starts here</span><h1>Find your perfect <em>rental home.</em></h1><p>Compare room photos, locations, and monthly rent to find a place that feels right.</p><div class="searchbox"><div class="field"><label>LOCATION</label><select id="hero-location">${locations.map(location=>`<option>${location}</option>`).join('')}</select></div><div class="field"><label>MONTHLY BUDGET</label><select id="hero-budget"><option value="">Any budget</option><option value="0-10000">Under ₹10,000</option><option value="10000-15000">₹10,000 - ₹15,000</option><option value="15000-25000">₹15,000 - ₹25,000</option><option value="25000-999999">₹25,000+</option></select></div><div class="field"><label>BEDROOMS</label><select id="hero-beds"><option value="">Any</option><option value="1">1 BHK</option><option value="2">2 BHK</option><option value="3">3 BHK</option><option value="4">4+ BHK</option></select></div><button class="btn" onclick="heroSearch()">Search rooms</button></div><div class="hero-note"><b>${properties.length} rental rooms</b> · 40 room photos distributed across the available listings</div><div class="hero-stats"><div class="hero-stat"><strong>${properties.length}</strong><span>Rooms to explore</span></div><div class="hero-stat"><strong>${new Set(properties.map(property=>property.location)).size}</strong><span>Local markets</span></div><div class="hero-stat"><strong>40</strong><span>Room photos</span></div></div></div></section><section class="section" id="features"><div class="section-head"><div><span class="section-kicker">A simpler way to rent</span><h2>Room photos. Clear prices.</h2><p>Each rental listing uses one of the supplied room photos, shared evenly throughout the dataset.</p></div><button class="btn btn-light" onclick="go('browse')">Browse all ${properties.length} rooms</button></div><div class="features"><div class="feature"><div class="feature-icon">40</div><div><strong>Room photos</strong><small>Distinct interiors from your supplied images</small></div></div><div class="feature"><div class="feature-icon">₹</div><div><strong>Monthly rent</strong><small>Compare actual listed rental prices</small></div></div><div class="feature"><div class="feature-icon">⌖</div><div><strong>Local markets</strong><small>Browse rooms across available locations</small></div></div><div class="feature"><div class="feature-icon">⌂</div><div><strong>Room details</strong><small>See bedrooms, bathrooms, and area</small></div></div></div></section><section class="section"><div class="section-head"><div><span class="section-kicker">A first look</span><h2>Available rental rooms</h2></div><button class="btn btn-light" onclick="go('browse')">See all rooms</button></div><div class="cards-grid">${properties.slice(0,3).map(card).join('')}</div></section></main>`}
function aboutPage(){return `${header()}<main class="section about-page"><span class="section-kicker">ABOUT RENTNEST</span><h1>Find a room that fits your life.</h1><p>RentNest brings 40 rental rooms, individual room photos, and clear monthly prices together in one place.</p><p>Compare room size, location, furnishing, and rent, then open any room to view its details or request a booking.</p><button class="btn" onclick="go('browse')">Browse rooms</button></main>`}
init();
</script>
</body></html>
